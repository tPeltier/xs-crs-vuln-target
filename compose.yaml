run_env: local
docker_registry: local

oss_crs_infra:
  cpuset: "0-1"
  memory: "8G"

llm_config:
  litellm:
    mode: internal
    internal:
      config_path: litellm-config.yaml

crs-bug-finding-template:
  cpuset: "2-7"
  memory: "16G"
  llm_budget: 100
  additional_env:
    CRS_AGENT: claude_code
    ANTHROPIC_MODEL: claude-opus-4-8
    CRS_ENTRYPOINT: "${CRS_ENTRYPOINT:-run_crs}"
    CRS_GRAPH_MAX_ROUNDS: "${CRS_GRAPH_MAX_ROUNDS:-0}"
    CRS_GRAPH_WARMUP: "${CRS_GRAPH_WARMUP:-60}"
    CRS_GRAPH_ROUND_TIMEOUT: "${CRS_GRAPH_ROUND_TIMEOUT:-1800}"
    CRS_GRAPH_BUDGET: "${CRS_GRAPH_BUDGET:-0}"
